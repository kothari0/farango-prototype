<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="badgeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#234a2c"/>
      <stop offset="100%" stop-color="#0d150f"/>
    </radialGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9b073"/>
      <stop offset="100%" stop-color="#b8894f"/>
    </linearGradient>
  </defs>

  <!-- badge ring -->
  <circle cx="32" cy="32" r="31" fill="url(#badgeGrad)" stroke="#b8894f" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#b8894f" stroke-width="0.6" opacity="0.5"/>

  <!-- putting green mound -->
  <ellipse cx="27" cy="46.5" rx="13" ry="3.4" fill="#0a100b" opacity="0.55"/>

  <!-- flag pole -->
  <line x1="25.5" y1="46" x2="25.5" y2="16" stroke="#f2e6cf" stroke-width="2.2" stroke-linecap="round"/>

  <!-- pennant -->
  <path d="M25.5 16.5 L41 22.5 L25.5 28.5 Z" fill="url(#flagGrad)"/>

  <!-- golf ball -->
  <circle cx="41.5" cy="41" r="5.4" fill="#f7f4ea"/>
  <circle cx="39.8" cy="39.3" r="0.65" fill="#c9bb98"/>
  <circle cx="42.6" cy="38.9" r="0.55" fill="#c9bb98"/>
  <circle cx="43.6" cy="41.4" r="0.55" fill="#c9bb98"/>
  <circle cx="40.4" cy="42.6" r="0.55" fill="#c9bb98"/>
  <circle cx="42.2" cy="43.6" r="0.5" fill="#c9bb98"/>
</svg>
